<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 6 - Nome Formatado</title>
</head>
<body>
    <script>
        // Solicita o nome completo
        var nome = prompt("Digite o seu nome completo:");

        // Exibe o nome no corpo da página com a formatação exigida:
        // cor vermelha, fonte 20px, alinhamento centralizado
        document.write("<p style='color: red; font-size: 20px; text-align: center;'>" + nome + "</p>");
    </script>
</body>
</html>
