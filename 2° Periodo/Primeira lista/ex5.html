<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 5 - Quantidade de Caracteres</title>
</head>
<body>
    <script>
        // Solicita o nome completo
        var nome = prompt("Digite o seu nome completo:");

        // Escreve no corpo do documento a quantidade de caracteres do nome
        document.write("O nome '" + nome + "' possui " + nome.length + " caracteres.");
    </script>
</body>
</html>
