<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1 - Nome Completo</title>
</head>
<body>
    <script>
        // Solicita o primeiro nome
        var primeiroNome = prompt("Digite o seu primeiro nome:");

        // Solicita o sobrenome
        var sobrenome = prompt("Digite o seu sobrenome:");

        // Monta o nome completo com espaço entre os dois
        var nomeCompleto = primeiroNome + " " + sobrenome;

        // Exibe o nome completo em uma nova caixa de diálogo
        alert("Seu nome completo é: " + nomeCompleto);
    </script>
</body>
</html>
