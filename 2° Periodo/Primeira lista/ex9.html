<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 9 - Calculadora de Expressão</title>
</head>
<body>
    <script>
        // Solicita a expressão matemática, ex: ((5*8)-9)
        var expressao = prompt("Digite uma expressão matemática (ex: ((5*8)-9)):");

        // Calcula o resultado da expressão usando eval()
        var resultado = eval(expressao);

        // Exibe o resultado através de um alert
        alert("Resultado de " + expressao + " = " + resultado);
    </script>
</body>
</html>
